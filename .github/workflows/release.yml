name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set version in build
        run: |
          sed -i "s/versionName = \"1.0\"/versionName = \"${{ steps.version.outputs.VERSION }}\"/" app/build.gradle.kts
          # Convert semver to version code: major*10000 + minor*100 + patch (e.g. 1.2.3 -> 10203)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.version.outputs.VERSION }}"
          MAJOR=$((10#${MAJOR:-0}))
          MINOR=$((10#${MINOR:-0}))
          PATCH=$((10#${PATCH:-0}))
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$VERSION_CODE" -gt 0 ] 2>/dev/null; then
            sed -i "s/versionCode = 1/versionCode = $VERSION_CODE/" app/build.gradle.kts
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk meshtop-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: meshtop-${{ github.ref_name }}.apk
